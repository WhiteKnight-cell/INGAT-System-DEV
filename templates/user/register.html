<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGAT — Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f0; font-family: 'Segoe UI', sans-serif; }
        .register-card {
            max-width: 480px;
            margin: 40px auto;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        }
        .logo-box {
            background-color: #2D6A4F;
            border-radius: 12px;
            width: 48px; height: 48px;
            display: flex; align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }
        .logo-box span { color: white; font-size: 20px; font-weight: 700; }
        .btn-ingat {
            background-color: #2D6A4F;
            color: white; border: none;
            border-radius: 8px; padding: 10px;
            font-weight: 600;
        }
        .btn-ingat:hover { background-color: #1f4f3a; color: white; }
    </style>
</head>
<body>
<div class="card register-card p-4">
    <div class="text-center mb-3">
        <div class="logo-box"><span>I</span></div>
        <h5 class="fw-bold mb-0">INGAT</h5>
        <small class="text-muted">Create your account</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('user.register') }}">
        <div class="mb-2">
            <label class="form-label small fw-semibold">Full Name</label>
            <input type="text" name="full_name" class="form-control"
                   placeholder="Juan dela Cruz" required>
        </div>
        <div class="mb-2">
            <label class="form-label small fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control"
                   placeholder="juan@email.com" required>
        </div>
        <div class="mb-2">
            <label class="form-label small fw-semibold">Contact Number (11 digits)</label>
            <input type="text" name="contact_number" class="form-control"
                   placeholder="09xxxxxxxxx" maxlength="11" required>
        </div>
        <div class="row mb-2">
            <div class="col">
                <label class="form-label small fw-semibold">Barangay</label>
                <input type="text" name="barangay" class="form-control"
                       placeholder="Tondo" required>
            </div>
            <div class="col">
                <label class="form-label small fw-semibold">Municipality</label>
                <input type="text" name="municipality" class="form-control"
                       placeholder="Manila" required>
            </div>
        </div>
        <div class="mb-2">
            <label class="form-label small fw-semibold">Password</label>
            <input type="password" name="password" class="form-control"
                   placeholder="Min. 8 chars, upper, lower, number, symbol" required>
        </div>
        <div class="mb-3">
            <label class="form-label small fw-semibold">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control"
                   placeholder="••••••••" required>
        </div>
        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-ingat">Register</button>
        </div>
        <div class="text-center">
            <small>Already have an account?
                <a href="{{ url_for('user.user_login') }}"
                   style="color:#2D6A4F;">Log in</a>
            </small>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
