<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INGAT — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f4f0; font-family: 'Segoe UI', sans-serif; }
        .login-card {
            max-width: 420px;
            margin: 80px auto;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        }
        .logo-box {
            background-color: #2D6A4F;
            border-radius: 12px;
            width: 48px; height: 48px;
            display: flex; align-items: center;
            justify-content: center;
            margin: 0 auto 10px;
        }
        .logo-box span { color: white; font-size: 20px; font-weight: 700; }
        .btn-ingat {
            background-color: #2D6A4F;
            color: white; border: none;
            border-radius: 8px; padding: 10px;
            font-weight: 600;
        }
        .btn-ingat:hover { background-color: #1f4f3a; color: white; }
        .toggle-pw {
            cursor: pointer;
            background: #f8f9fa;
            border: 1px solid #ced4da;
            border-left: none;
            padding: 0 12px;
            border-radius: 0 6px 6px 0;
            color: #6c757d;
        }
        .toggle-pw:hover { background: #e9ecef; }
    </style>
</head>
<body>
<div class="card login-card p-4">
    <div class="text-center mb-4">
        <div class="logo-box"><span>I</span></div>
        <h5 class="fw-bold mb-0">INGAT</h5>
        <small class="text-muted">Welcome back</small>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('user.user_login') }}">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Email Address</label>
            <input type="email" name="email" class="form-control"
                   placeholder="juan@email.com" required>
        </div>

        <!-- Password with eye toggle -->
        <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <div class="d-flex">
                <input type="password" name="password" id="password"
                       class="form-control" style="border-radius: 6px 0 0 6px;"
                       placeholder="••••••••" required>
                <button type="button" class="toggle-pw" onclick="togglePw('password', 'eye1')">
                    <i id="eye1" class="bi bi-eye"></i>
                </button>
            </div>
        </div>

        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-ingat">Log In</button>
        </div>
        <div class="text-center mb-2">
            <a href="{{ url_for('user.forgot_password') }}" class="small text-muted">Forgot Password? Click here</a>
        </div>
        <div class="text-center">
            <small>Don't have an account?
                <a href="{{ url_for('user.register') }}"
                   style="color:#2D6A4F;">Register</a>
            </small>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function togglePw(fieldId, iconId) {
        const field = document.getElementById(fieldId);
        const icon = document.getElementById(iconId);
        if (field.type === 'password') {
            field.type = 'text';
            icon.classList.remove('bi-eye');
            icon.classList.add('bi-eye-slash');
        } else {
            field.type = 'password';
            icon.classList.remove('bi-eye-slash');
            icon.classList.add('bi-eye');
        }
    }
</script>
</body>
</html>
